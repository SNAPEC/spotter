default: &default
  store_options:
    # Rate-limit entries are keyed on an IP HMAC, brute-forceable over IPv4: keep them a day at most.
    max_age: <%= 1.day.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
