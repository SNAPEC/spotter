# The repository is public: the server address is read from the environment of the machine that runs kamal.
<% server_ip = ENV.fetch("SPOTTER_SERVER_IP") %>

service: spotter

image: spotter

servers:
  web:
    - <%= server_ip %>

proxy:
  ssl: true
  host: spotter.rosalp.fr
  # Puma, with no Thruster in between (it logs the request path, magic-link token included, on a 502).
  app_port: 3000
  healthcheck:
    path: /up
  run:
    # Kamal 2.12 would start v0.9.2, whose image carries known CVEs.
    version: v0.10.3
    # kamal-proxy writes one line per request with the client IP, and has no switch to turn it off:
    # its container keeps no log at all. Debugging it means booting it again with a log driver.
    log_max_size: ""
    options:
      log-driver: none

# Two Rails boots (db:prepare, then the server) on one shared vCPU before /up answers.
deploy_timeout: 90

# The disk of a small instance: the running image and one to roll back to.
retain_containers: 2

# Images go through a registry run locally by kamal and reached from the server over SSH.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - SPOTTER_DATABASE_PASSWORD
  clear:
    # Sized for a 1 GB server: Puma in single mode (no WEB_CONCURRENCY), Solid Queue in Puma, one job worker.
    RAILS_MAX_THREADS: 3
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "spotter_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: <%= server_ip %>
    # No port is published: only containers on the kamal network reach it, as spotter-db.
    env:
      clear:
        POSTGRES_USER: spotter
        POSTGRES_DB: spotter_production
      secret:
        - POSTGRES_PASSWORD:SPOTTER_DATABASE_PASSWORD
    volumes:
      - "spotter_db_data:/var/lib/postgresql/data"
    # Logs: terse errors, so a duplicate key never prints the deterministic ciphertext of an email; no
    # client address, no connection, no statement nor its values. Memory: sized for a 1 GB server.
    cmd: >-
      postgres
      -c log_error_verbosity=terse
      -c log_line_prefix='%m [%p] '
      -c log_connections=off
      -c log_disconnections=off
      -c log_hostname=off
      -c log_statement=none
      -c log_min_error_statement=panic
      -c log_min_duration_statement=-1
      -c log_parameter_max_length=0
      -c log_parameter_max_length_on_error=0
      -c track_commit_timestamp=off
      -c max_connections=50
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
