# Classes behind config.x.llm_extractor and config.x.membership_verifier (see initializers/external_services.rb).
default: &default
  llm_extractor: Llm::FakeExtractor
  membership_verifier: Membership::FakeVerifier

development:
  <<: *default

test:
  <<: *default

production:
  # The LLM double stays in production until the Scaleway extractor exists: its proposals are only
  # suggestions, and an analyst validates every report.
  llm_extractor: Llm::FakeExtractor
  # Never the double here: it says everyone is a member. The base class refuses every check until the
  # SNAPEC membership API client exists.
  membership_verifier: Membership::Verifier
