#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  purge_expired_sessions:
    class: PurgeExpiredSessionsJob
    schedule: every day at 3am
  cut_ownerships:
    class: CutOwnershipsJob
    schedule: every day at 3am
  close_expired_edit_windows:
    class: CloseExpiredEditWindowsJob
    schedule: every day at 3am
  requeue_stalled_analyses:
    class: RequeueStalledAnalysesJob
    schedule: every day at 4am
  purge_expired_drafts:
    class: PurgeExpiredDraftsJob
    schedule: every day at 3am
  purge_unused_accounts:
    class: PurgeUnusedAccountsJob
    schedule: every day at 3am
  # Weekly, so a digest's time in the mail provider's log points to a week of questions, not to one.
  clarification_digest:
    class: ClarificationDigestJob
    schedule: "0 7 * * 1 Europe/Paris"
