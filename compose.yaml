services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spotter_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spotter_pg_data:
